services:
  solr:
    image: solr:10
    command: ["solr-precreate", "pri"]
    ports:
      - "127.0.0.1:8983:8983"
    volumes:
      - solr10-data:/var/solr
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8983/solr/admin/info/system >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  solr10-data:
